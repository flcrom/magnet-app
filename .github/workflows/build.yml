name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: magnet-debug, path: app/build/outputs/apk/debug/app-debug.apk }
      - name: publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk magnet.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "latest build" --notes "debug APK, built by Actions"
          gh release upload latest magnet.apk --clobber
